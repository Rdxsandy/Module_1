services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctvpassword
      POSTGRES_DB: cctv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
